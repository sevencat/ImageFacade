name: ci

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-test-pack:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ImageFacade.slnx

      - name: Build
        run: dotnet build ImageFacade.slnx -c Release --no-restore

      - name: Test
        run: dotnet test ImageFacade.slnx -c Release --no-build --logger "console;verbosity=normal"

      # 打包本身就是一条验收项：7 个包 + 7 个符号包，且适配包只能依赖自己的三方库版本。
      - name: Pack
        run: dotnet pack ImageFacade.slnx -c Release --no-build -o artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
